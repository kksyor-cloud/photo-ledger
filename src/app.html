<style>
/* Layout: one-column field tool, sticky top bar, thumb-reachable action bar fixed to the bottom */
:root {
  --bg: #EEF0EE;         /* poured-concrete grey, faint green bias */
  --surface: #FFFFFF;
  --sunk: #E2E5E3;
  --ink: #1B2024;
  --muted: #5B6670;
  --line: #CDD3D6;
  --accent: #F2B705;     /* safety-vest yellow */
  --on-accent: #1B2024;
  --mark: #E0322B;       /* marking red, also the "missing" signal */
  --ok: #2E8A57;
  --warn: #B86E00;
  --scrim: rgba(17, 21, 24, .48);
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --r: 10px;
  --bar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181B; --surface: #1E2428; --sunk: #2A3136; --ink: #ECEFF0; --muted: #9AA6AE;
    --line: #333C42; --accent: #F5C230; --on-accent: #14181B; --mark: #FF5A4F; --ok: #4CB97A; --warn: #E7A33A;
    --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181B; --surface: #1E2428; --sunk: #2A3136; --ink: #ECEFF0; --muted: #9AA6AE;
  --line: #333C42; --accent: #F5C230; --on-accent: #14181B; --mark: #FF5A4F; --ok: #4CB97A; --warn: #E7A33A;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; min-height: 56px;
}
.topbar h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-wrap: balance; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: grid; place-items: center; flex: none;
}
.iconbtn:active { background: var(--sunk); }
.iconbtn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

main { padding-block: 16px calc(var(--bar-h) + 32px + env(safe-area-inset-bottom, 0px)); max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }

/* bottom action bar */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; justify-content: center;
}
.actionbar > .inner { display: flex; gap: 8px; width: 100%; max-width: 760px; }
.btn {
  min-height: 48px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); padding: 0 16px;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
}
.btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--mark); }
.btn.grow { flex: 1; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }

/* home list */
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.cards { display: grid; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 8px 14px 16px;
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
}
.card .body { flex: 1; min-width: 0; display: grid; gap: 4px; }
.card .title { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.chip.warn { color: var(--mark); background: color-mix(in srgb, var(--mark) 12%, transparent); }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.chip.sample { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.thumbstrip { width: 56px; height: 56px; border-radius: 8px; border: 0; padding: 0; background: var(--sunk) center/cover no-repeat; flex: none; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; display: grid; gap: 12px; justify-items: center; }

/* inspection header */
.infobox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.infobox dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 14px; }
.infobox dt { color: var(--muted); }
.infobox dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }

/* photo grid */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--sunk); border: 0; padding: 0; max-width: 100%; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .no { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.62); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
.tile .flag { position: absolute; right: 6px; top: 6px; background: var(--mark); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; }
.tile.excluded img { opacity: .35; }
.tile .ex { position: absolute; inset: auto 0 0 0; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 2px; text-align: center; }
.tile .reorder { position: absolute; inset: auto 4px 4px 4px; display: flex; justify-content: space-between; }
.tile .reorder button { width: 36px; height: 32px; border-radius: 8px; border: 0; background: rgba(255,255,255,.92); color: #1B2024; font-weight: 700; }

/* editor */
.stage { position: relative; background: #111; border-radius: var(--r); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage canvas { display: block; width: 100%; height: auto; touch-action: none; }
.tools { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tool {
  flex: none; min-width: 52px; height: 52px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; font-size: 11px; gap: 0; padding: 4px 6px; line-height: 1.1;
}
.tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.swatches { display: flex; gap: 8px; align-items: center; }
.swatch { width: 34px; height: 34px; border-radius: 17px; border: 2px solid var(--line); }
.swatch[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-height: 36px; padding: 0 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.fields { display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inputwrap { display: flex; gap: 8px; align-items: stretch; }
.inputwrap textarea, .inputwrap input { flex: 1; min-width: 0; }
textarea, input[type=text], input[type=date], select {
  width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 12px; min-height: 48px; font-size: 16px;
}
textarea { resize: vertical; min-height: 56px; }
.mic { width: 52px; flex: none; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.mic svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mic.on { background: var(--mark); color: #fff; border-color: var(--mark); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--mark) 30%, transparent); } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
.phrases { display: flex; gap: 6px; flex-wrap: wrap; }
.phrases button { border: 1px solid var(--line); background: var(--sunk); border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 4px 0; }
.meta-line { color: var(--muted); font-size: 12.5px; }

/* export */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; }
.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice button { border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px; text-align: left; display: grid; gap: 4px; }
.choice button b { font-size: 15px; }
.choice button span { font-size: 12.5px; color: var(--muted); }
.choice button[aria-pressed="true"] { border-color: var(--ink); }
.check { display: flex; gap: 10px; align-items: center; min-height: 40px; }
.check input { width: 22px; height: 22px; accent-color: var(--ink); }
.pages { display: grid; gap: 14px; justify-items: center; }
.pages img { width: 100%; max-width: 520px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); border-radius: 2px; }
.pages .cap { font-size: 12px; color: var(--muted); }

/* sheet + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; max-height: 92%; overflow-y: auto;
  padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px;
}
.sheet h2 { margin: 0; font-size: 18px; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 28px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); text-align: center;
}
.banner { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: var(--r); padding: 10px 12px; font-size: 13.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

const ICON = {

let toastTimer;
function toast(msg, ms = 2600) {

  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);

/* ---------- storage (IndexedDB, in-memory fallback) ---------- */
const mem = { inspections: new Map(), photos: new Map(), settings: new Map() };
let idb = null;
function openDB() {
  return new Promise((resolve) => {
    try {
      const r = indexedDB.open('photo-ledger', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('inspections', { keyPath: 'id' });
        const p = d.createObjectStore('photos', { keyPath: 'id' });
        p.createIndex('by_insp', 'inspectionId');
        d.createObjectStore('settings');

      r.onsuccess = () => resolve(r.result);

      r.onblocked = () => resolve(null);

}
function tx(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = idb.transaction(store, mode); const s = t.objectStore(store);
    const req = fn(s);

    t.onerror = () => reject(t.error);
  });

const store = {
  async put(name, val, key) {

  async get(name, key) {
    if (!idb) { const v = mem[name].get(key); return v && structuredClone(v); }

  },
  async all(name) {
    if (!idb) return [...mem[name].values()].map(v => structuredClone(v));

  async del(name, key) {
    if (!idb) { mem[name].delete(key); return; }

  async photosOf(inspId) {
    if (!idb) return [...mem.photos.values()].filter(p => p.inspectionId === inspId).map(v => structuredClone(v));

const DEFAULT_SETTINGS = {

  color: '#E53935', width: 2, geo: false,

  try { const s = await store.get('settings', 'main'); if (s) settings = { ...structuredClone(DEFAULT_SETTINGS), ...s, labels: { ...DEFAULT_SETTINGS.labels, ...(s.labels || {}) } }; } catch (e) {}

  return new Promise(res => {
    if (!settings.geo || !navigator.geolocation) return res(null);
    try { navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { timeout: 5000, maximumAge: 60000 }); }
    catch (e) { res(null); }
  });
}
async function addFiles(insp, files) {
  if (!files.length) return 0;
  const geo = await getGeo();
  let n = 0;
  for (const f of files) {
    try {
      const src = await decode(f);
      const big = await scaled(src, MAX_SIDE, 0.88);
      const th = await scaled(src, THUMB, 0.75);
      const p = {
        id: uid(), inspectionId: insp.id, data: await big.blob.arrayBuffer(), type: 'image/jpeg', thumb: await th.blob.arrayBuffer(),
        w: big.w, h: big.h, takenAt: f.lastModified || Date.now(), lat: geo?.lat ?? null, lng: geo?.lng ?? null,
        fields: { loc: '', desc: '', act: '' }, marks: [], include: true,
      };
      await store.put('photos', p);
      insp.order.push(p.id); n++;
    } catch (e) { toast('사진 한 장을 읽지 못해 건너뛰었습니다.'); }
  }
  insp.updatedAt = Date.now();
  await store.put('inspections', insp);
  return n;
}

/* ---------- marks: geometry + drawing (normalized 0..1 coords) ---------- */
const WIDTHS = [0, 0.0032, 0.0055, 0.0085]; // fraction of the shorter image side
function lw(m, W, H) { return Math.max(1.5, (WIDTHS[m.w] || WIDTHS[2]) * Math.min(W, H)); }
function drawArrow(ctx, x1, y1, x2, y2, w) {
  const a = Math.atan2(y2 - y1, x2 - x1), hl = Math.max(10, w * 4.2);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hl * 0.6, y2 - Math.sin(a) * hl * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hl * Math.cos(a - 0.45), y2 - hl * Math.sin(a - 0.45));
  ctx.lineTo(x2 - hl * Math.cos(a + 0.45), y2 - hl * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
}
function drawMarks(ctx, marks, ox, oy, W, H) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const m of marks) {
    const w = lw(m, W, H); ctx.strokeStyle = m.c; ctx.fillStyle = m.c; ctx.lineWidth = w;
    const X = x => ox + x * W, Y = y => oy + y * H;
    if (m.t === 'pen') {
      ctx.beginPath(); m.p.forEach((pt, i) => i ? ctx.lineTo(X(pt[0]), Y(pt[1])) : ctx.moveTo(X(pt[0]), Y(pt[1]))); ctx.stroke();
    } else if (m.t === 'arrow') {
      drawArrow(ctx, X(m.x1), Y(m.y1), X(m.x2), Y(m.y2), w);
    } else if (m.t === 'circle') {
      const cx = X((m.x1 + m.x2) / 2), cy = Y((m.y1 + m.y2) / 2), rx = Math.abs(m.x2 - m.x1) * W / 2, ry = Math.abs(m.y2 - m.y1) * H / 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI * 2); ctx.stroke();
    } else if (m.t === 'rect') {
      ctx.strokeRect(X(Math.min(m.x1, m.x2)), Y(Math.min(m.y1, m.y2)), Math.abs(m.x2 - m.x1) * W, Math.abs(m.y2 - m.y1) * H);
    } else if (m.t === 'text') {
      const fs = Math.max(12, Math.min(W, H) * (0.03 + 0.012 * (m.w || 2)));
      ctx.font = `700 ${fs}px ${FONT_CANVAS}`; ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, fs * 0.16); ctx.strokeStyle = isLight(m.c) ? 'rgba(0,0,0,.75)' : 'rgba(255,255,255,.9)';
      ctx.strokeText(m.s, X(m.x), Y(m.y)); ctx.fillText(m.s, X(m.x), Y(m.y));
    } else if (m.t === 'num') {
      const r = Math.max(9, Math.min(W, H) * (0.022 + 0.006 * (m.w || 2)));
      ctx.beginPath(); ctx.arc(X(m.x), Y(m.y), r, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = Math.max(1.5, r * 0.14); ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.fillStyle = isLight(m.c) ? '#111' : '#fff'; ctx.font = `700 ${r * 1.15}px ${FONT_CANVAS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(m.n), X(m.x), Y(m.y) + r * 0.05); ctx.textAlign = 'left';
    }
  }
  ctx.restore();
}
function isLight(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 170; }
function bbox(m, ctx, W, H) {
  if (m.t === 'pen') { const xs = m.p.map(p => p[0]), ys = m.p.map(p => p[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; }
  if (m.t === 'text') {
    const fs = Math.max(12, Math.min(W, H) * (0.03 + 0.012 * (m.w || 2)));
    ctx.font = `700 ${fs}px ${FONT_CANVAS}`; const tw = ctx.measureText(m.s).width;
    return [m.x, m.y, m.x + tw / W, m.y + fs * 1.2 / H];
  }
  if (m.t === 'num') { const r = Math.min(W, H) * (0.022 + 0.006 * (m.w || 2)); return [m.x - r / W, m.y - r / H, m.x + r / W, m.y + r / H]; }
  return [Math.min(m.x1, m.x2), Math.min(m.y1, m.y2), Math.max(m.x1, m.x2), Math.max(m.y1, m.y2)];
}
function moveMark(m, dx, dy) {
  if (m.t === 'pen') m.p = m.p.map(p => [p[0] + dx, p[1] + dy]);
  else if (m.t === 'text' || m.t === 'num') { m.x += dx; m.y += dy; }
  else { m.x1 += dx; m.x2 += dx; m.y1 += dy; m.y2 += dy; }
}

async function loadInsp(id) {
  current = await store.get('inspections', id);
  if (!current) { photos = []; return; }
  const list = await store.photosOf(id);
  const byId = new Map(list.map(p => [p.id, p]));
  photos = current.order.map(i => byId.get(i)).filter(Boolean);
  // keep order list consistent with what exists
  if (photos.length !== current.order.length) { current.order = photos.map(p => p.id); await store.put('inspections', current); }
}

/* ---------- saving files ---------- */
let dlNs;
const downloadsNs = () => dlNs ??= (window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null));
async function saveFile(blob, filename) {
  const ns = await downloadsNs();
  if (ns) {
    try { await ns.save({ filename, data: blob }); toast('저장했습니다.'); }
    catch (e) { if (e?.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없습니다.'); }
    return;
  }
  const file = new File([blob], filename, { type: blob.type });
  if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  toast('파일을 내려받았습니다.');
}
const safeName = s => String(s || '사진대지').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60);

/* ---------- export view ---------- */
let previewURLs = [];
async function renderExport() {
  if (!current) return go('home');
  setTop('출력', { back: () => go('insp') });
  const list = photos.filter(p => p.include);
  const miss = list.filter(p => !p.fields.desc.trim()).length;
  const v = $('#view');
  v.innerHTML = `
    <section class="panel">
      <span class="eyebrow">양식</span>
      <div class="choice">
        <button data-mode="a4" aria-pressed="${state.exportMode === 'a4'}"><b>A4 2장 구성</b><span>A4 세로 1매에 사진 2장. 인쇄·제출용 PDF</span></button>
        <button data-mode="single" aria-pressed="${state.exportMode === 'single'}"><b>사진 1장 단위</b><span>사진마다 한 장. 카톡·메일 공유용</span></button>
      </div>
      ${state.exportMode === 'a4'
        ? `<label class="check"><input type="checkbox" id="cover" ${state.cover ? 'checked' : ''}> 표지 넣기</label>`
        : `<div class="seg" role="group" aria-label="파일 형식"><button data-fmt="zip" aria-pressed="${state.singleFmt === 'zip'}">JPG 묶음(zip)</button><button data-fmt="pdf" aria-pressed="${state.singleFmt === 'pdf'}">PDF (1면 1장)</button></div>`}

      ${miss ? `<div class="banner">설명이 비어 있는 사진이 ${miss}장 있습니다. 그대로 출력하면 빈 칸으로 나옵니다.</div>` : ''}
    </section>
    <div class="row between"><span class="eyebrow">미리보기</span></div>

  `;
  v.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { state.exportMode = b.dataset.mode; renderExport(); });

  const label = state.exportMode === 'a4' ? 'PDF 저장' : state.singleFmt === 'zip' ? 'JPG 묶음 저장' : 'PDF 저장';
  setActions(`<button class="btn primary grow" id="saveBtn" ${list.length ? '' : 'disabled'}>${svg('print')}${label}</button>`);
  $('#saveBtn').onclick = () => doExport(list);
  if (!list.length) { $('#pages').innerHTML = '<span class="meta-line">출력에 포함된 사진이 없습니다.</span>'; return; }
  const myView = state.view, myMode = state.exportMode;

  previewURLs.forEach(u => URL.revokeObjectURL(u)); previewURLs = [];

  for (let i = 0; i < canvases.length; i++) {
    const b = await canvasToBlob(canvases[i], 'image/jpeg', 0.7); const u = URL.createObjectURL(b); previewURLs.push(u);

async function buildCanvases(list) {
  if (state.exportMode === 'a4') return composeA4Pages(current, list, state.cover);
  const out = []; for (let i = 0; i < list.length; i++) out.push(await composeSingle(current, list[i], i + 1)); return out;
}
async function doExport(list) {

  try {

    const canvases = await buildCanvases(list);
    if (state.exportMode === 'a4') await saveFile(await buildPDF(canvases, [595.28, 841.89]), `${base}.pdf`);
    else if (state.singleFmt === 'pdf') await saveFile(await buildPDF(canvases, null), `${base}_1장단위.pdf`);
    else {
      const files = [];
      for (let i = 0; i < canvases.length; i++) files.push({ name: `${String(i + 1).padStart(2, '0')}_${safeName(list[i].fields.loc || '사진')}.jpg`, data: await jpegBytes(canvases[i], 0.9) });
      await saveFile(buildZip(files), `${base}_JPG.zip`);

}

/* ---------- sample data (clearly labelled 예시) ---------- */
function synthPhoto(kind) {
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1200; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1200); g.addColorStop(0, '#9BA3A8'); g.addColorStop(1, '#6F777C'); x.fillStyle = g; x.fillRect(0, 0, 1600, 1200);
  let s = kind * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${rnd() > .5 ? '255,255,255' : '0,0,0'},${rnd() * .08})`; x.fillRect(rnd() * 1600, rnd() * 1200, 3, 3); }
  if (kind === 0) { // column with exposed rebar
    x.fillStyle = '#B5B9B6'; x.fillRect(560, 0, 480, 1200); x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(1000, 0, 40, 1200);
    x.fillStyle = '#5A3A2A'; for (let i = 0; i < 4; i++) x.fillRect(700 + i * 70, 420, 14, 260);
    x.fillStyle = '#7A7F7C'; x.beginPath(); x.ellipse(800, 550, 170, 190, 0, 0, Math.PI * 2); x.globalAlpha = .35; x.fill(); x.globalAlpha = 1;
  } else if (kind === 1) { // stairwell edge without guardrail
    x.fillStyle = '#C9CCC8'; for (let i = 0; i < 7; i++) x.fillRect(200 + i * 150, 1100 - i * 130, 600, 130);
    x.fillStyle = '#2B2F33'; x.fillRect(1250, 0, 350, 1200);
  } else { // wall crack
    x.fillStyle = '#C2C5C1'; x.fillRect(0, 0, 1600, 1200);
    x.strokeStyle = '#3C3F3D'; x.lineWidth = 6; x.beginPath(); x.moveTo(420, 120); [[520, 340], [480, 520], [610, 700], [570, 880], [690, 1100]].forEach(([a, b]) => x.lineTo(a, b)); x.stroke();
  }
  return c;
}
async function seedSample() {
  const insp = { id: uid(), title: '(예시) OO아파트 신축공사 3층 골조', date: today(), category: '품질', inspector: '홍길동', note: '예시 데이터입니다. 지워도 됩니다.', order: [], sample: true, createdAt: Date.now(), updatedAt: Date.now() };
  const data = [
    { f: { loc: '3층 B구역 기둥 C-3', desc: '피복 두께 부족, 철근 노출', act: '보수 후 재점검 요청' }, m: [{ t: 'circle', x1: .37, y1: .26, x2: .63, y2: .66, c: '#E53935', w: 3 }, { t: 'text', x: .66, y: .3, s: '철근 노출', c: '#E53935', w: 2 }] },
    { f: { loc: '4층 계단실', desc: '안전난간 미설치', act: '즉시 설치 지시' }, m: [{ t: 'arrow', x1: .55, y1: .2, x2: .74, y2: .42, c: '#FDD835', w: 3 }, { t: 'num', x: .5, y: .16, n: 1, c: '#FDD835', w: 2 }] },
    { f: { loc: '3층 A구역 벽체', desc: '', act: '' }, m: [{ t: 'rect', x1: .22, y1: .06, x2: .48, y2: .95, c: '#E53935', w: 2 }] },
  ];
  for (let k = 0; k < data.length; k++) {
    const c = synthPhoto(k);
    const big = await canvasToBlob(c, 'image/jpeg', 0.85); const th = await scaled(c, THUMB, 0.75);
    const p = { id: uid(), inspectionId: insp.id, data: await big.arrayBuffer(), type: 'image/jpeg', thumb: await th.blob.arrayBuffer(), w: 1600, h: 1200, takenAt: Date.now() - (3 - k) * 600000, lat: null, lng: null, fields: data[k].f, marks: data[k].m, include: true };
    await store.put('photos', p); insp.order.push(p.id);
  }
  await store.put('inspections', insp);
}
