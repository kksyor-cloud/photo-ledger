<title>현장 사진대지</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column field tool. Safety-yellow top bar with a hazard stripe, today's photos first and past days below, capture bar fixed to the bottom */
:root {
  --bg: #FFFAE6;         /* pale safety yellow paper */
  --surface: #FFFFFF;
  --sunk: #F4EDD2;
  --ink: #17150F;
  --muted: #6B6250;
  --line: #E6DCB6;
  --yellow: #FFC400;     /* brand bar, date blocks, highlights */
  --soft: #FFF2BF;
  --primary: #17150F;    /* the one action on each screen: black with yellow type */
  --on-primary: #FFC400;
  --mark: #D9312A;       /* marking red, also the "missing" signal */
  --ok: #1F7A3D;
  --warn: #9A5C00;
  --scrim: rgba(23, 21, 15, .5);
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --r: 10px;
  --bar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13120E; --surface: #1D1B15; --sunk: #29261D; --ink: #F6F1E1; --muted: #B4AA8E; --line: #3A3527; --soft: #3A3112;
    --primary: #FFC400; --on-primary: #17150F; --mark: #FF5A4F; --ok: #4CB97A; --warn: #E7A33A; --scrim: rgba(0, 0, 0, .62); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13120E; --surface: #1D1B15; --sunk: #29261D; --ink: #F6F1E1; --muted: #B4AA8E; --line: #3A3527; --soft: #3A3112;
  --primary: #FFC400; --on-primary: #17150F; --mark: #FF5A4F; --ok: #4CB97A; --warn: #E7A33A; --scrim: rgba(0, 0, 0, .62); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar: always safety yellow, black type, hazard stripe underneath */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #FFC400; color: #17150F;
  display: flex; align-items: center; gap: 6px; min-height: 60px; padding-bottom: 8px;
}
.topbar::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-linear-gradient(-45deg, #17150F 0 9px, #FFC400 9px 18px); }
.topbar .ttl { flex: 1; min-width: 0; display: grid; padding-block: 6px; }
.topbar h1 { font-size: 19px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.topbar small { font-size: 12.5px; font-weight: 600; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: grid; place-items: center; flex: none; color: inherit;
}
.iconbtn:active { background: rgba(0,0,0,.1); }
.iconbtn:disabled { opacity: .35; }
.iconbtn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

main { padding-block: 16px calc(var(--bar-h) + 32px + env(safe-area-inset-bottom, 0px)); max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }

/* bottom action bar */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; justify-content: center;
}
.actionbar > .inner { display: flex; gap: 8px; width: 100%; max-width: 760px; }
.btn {
  min-height: 52px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); padding: 0 16px;
  font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; font-size: 16px;
}
.btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.yellow { background: #FFC400; color: #17150F; border-color: #E0A800; }
.btn.danger { color: var(--mark); }
.btn.grow { flex: 1; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }

/* section labels */
.eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.eyebrow::before { content: ''; width: 10px; height: 10px; background: #FFC400; border: 2px solid var(--ink); border-radius: 2px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.chip.warn { color: var(--mark); background: color-mix(in srgb, var(--mark) 12%, transparent); }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.chip.sample { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; display: grid; gap: 8px; justify-items: center; }
.banner { background: var(--soft); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: var(--r); padding: 10px 12px; font-size: 13.5px; }

/* today card */
.today { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid #FFC400; border-radius: var(--r); padding: 14px 14px 16px; display: grid; gap: 12px; }
.today .when { font-size: 23px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.today .label { font-size: 13px; font-weight: 700; color: var(--muted); }

/* past days */
.days { display: grid; gap: 8px; }
.daycard { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; width: 100%; text-align: left; }
.datebox { width: 56px; height: 56px; border-radius: 8px; background: #FFC400; color: #17150F; display: grid; place-items: center; align-content: center; line-height: 1.05; flex: none; }
.datebox b { font-size: 23px; }
.datebox span { font-size: 12px; font-weight: 700; }
.daycard .body { flex: 1; min-width: 0; display: grid; gap: 5px; }
.daycard .title { font-weight: 700; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.daycard .meta { display: flex; gap: 5px; flex-wrap: wrap; }
.minithumbs { display: flex; gap: 4px; flex: none; }
.minithumbs img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--sunk); display: block; }
@media (max-width: 400px) { .minithumbs img:nth-child(n+3) { display: none; } }
.month { margin-top: 6px; }

/* photo grid */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--sunk); border: 0; padding: 0; max-width: 100%; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .time { position: absolute; left: 5px; bottom: 5px; background: rgba(0,0,0,.66); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
.tile .flag { position: absolute; right: 5px; top: 5px; background: var(--mark); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; }
.tile .pub { position: absolute; left: 5px; top: 5px; background: #17150F; color: #FFC400; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
.tile .reorder { position: absolute; inset: auto 4px 4px 4px; display: flex; justify-content: space-between; }
.tile .reorder button { width: 36px; height: 32px; border-radius: 8px; border: 0; background: rgba(255,255,255,.94); color: #17150F; font-weight: 700; }

/* editor */
.stage { position: relative; background: #111; border-radius: var(--r); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage canvas { display: block; width: 100%; height: auto; touch-action: none; }
.tools { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tool {
  flex: none; min-width: 52px; height: 52px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface);
  display: grid; place-items: center; font-size: 11px; gap: 0; padding: 4px 6px; line-height: 1.1;
}
.tool svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.swatches { display: flex; gap: 8px; align-items: center; }
.swatch { width: 34px; height: 34px; border-radius: 17px; border: 2px solid var(--line); }
.swatch[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-height: 36px; padding: 0 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 700; }
.fields { display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inputwrap { display: flex; gap: 8px; align-items: stretch; }
.inputwrap textarea, .inputwrap input { flex: 1; min-width: 0; }
textarea, input[type=text], input[type=date], select {
  width: 100%; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 12px; min-height: 48px; font-size: 16px;
}
textarea:focus, input:focus { border-color: #E0A800; outline: 3px solid color-mix(in srgb, #FFC400 45%, transparent); outline-offset: 0; }
textarea { resize: vertical; min-height: 56px; }
.mic { width: 52px; flex: none; border-radius: var(--r); border: 1.5px solid #E0A800; background: #FFC400; color: #17150F; display: grid; place-items: center; }
.mic svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.mic.on { background: var(--mark); color: #fff; border-color: var(--mark); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--mark) 30%, transparent); } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
.phrases { display: flex; gap: 6px; flex-wrap: wrap; }
.phrases button { border: 1px solid var(--line); background: var(--soft); border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; padding: 4px 0; }
.meta-line { color: var(--muted); font-size: 12.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; }
.check { display: flex; gap: 10px; align-items: center; min-height: 40px; }
.check input { width: 22px; height: 22px; accent-color: #17150F; }

/* sheet + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; max-height: 92%; overflow-y: auto; border-top: 6px solid #FFC400;
  padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px;
}
.sheet h2 { margin: 0; font-size: 18px; text-wrap: balance; }
.sheet p { margin: 0; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 28px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: #17150F; color: #FFC400; font-weight: 600; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); text-align: center;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const dayOf = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const today = () => dayOf(Date.now());
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const parseDay = id => { const [y, m, d] = id.split('-').map(Number); return new Date(y, m - 1, d); };
const dayLabel = id => { const d = parseDay(id); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`; };
const fmtDate = s => s ? s.replaceAll('-', '.') : '';
const fmtTime = ts => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtDT = ts => ts ? `${fmtDate(dayOf(ts))} ${fmtTime(ts)}` : '';
const ICON = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  more: '<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
  cam: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  img: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  mic: '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  arrow: '<path d="M5 19L19 5M9 5h10v10"/>',
  circle: '<circle cx="12" cy="12" r="8"/>',
  rect: '<rect x="4" y="6" width="16" height="12" rx="1"/>',
  text: '<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',
  num: '<circle cx="12" cy="12" r="9"/><path d="M10.5 8.5L12 7.5V16.5"/>',
  move: '<path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
  redo: '<path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  prev: '<path d="M15 18l-6-6 6-6"/>', next: '<path d="M9 18l6-6-6-6"/>',
};
const svg = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

let toastTimer;
function toast(msg, ms = 2600) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

/* ---------- storage (IndexedDB, in-memory fallback) ----------
   days:   { id: 'YYYY-MM-DD', site, order: [photoId], sample?, updatedAt }
   photos: small records only (fields, marks, times), so every edit saves fast
   blobs / thumbs: the image bytes, written once when a photo is added */
const mem = { days: new Map(), photos: new Map(), blobs: new Map(), thumbs: new Map(), settings: new Map(), inspections: new Map() };
let idb = null;
function openDB() {
  return new Promise((resolve) => {
    try {
      const r = indexedDB.open('photo-ledger', 2);
      r.onupgradeneeded = () => {
        const d = r.result, has = n => d.objectStoreNames.contains(n);
        if (!has('days')) d.createObjectStore('days', { keyPath: 'id' });
        if (!has('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
        if (!has('thumbs')) d.createObjectStore('thumbs', { keyPath: 'id' });
        if (!has('settings')) d.createObjectStore('settings');
        if (!has('inspections')) d.createObjectStore('inspections', { keyPath: 'id' }); // version 1 data, moved into days by migrate()
        const ps = has('photos') ? r.transaction.objectStore('photos') : d.createObjectStore('photos', { keyPath: 'id' });
        if (!ps.indexNames.contains('by_day')) ps.createIndex('by_day', 'day');
      };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => resolve(null);
      r.onblocked = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
function tx(name, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = idb.transaction(name, mode); const s = t.objectStore(name);
    const req = fn(s);
    t.oncomplete = () => resolve(req && req.result);
    t.onerror = () => reject(t.error);
  });
}
const plain = name => name === 'blobs' || name === 'thumbs';
const store = {
  async put(name, val, key) {
    if (!idb) { mem[name].set(key ?? val.id, plain(name) ? val : structuredClone(val)); return; }
    return tx(name, 'readwrite', s => key !== undefined ? s.put(val, key) : s.put(val));
  },
  async get(name, key) {
    if (!idb) { const v = mem[name].get(key); return v && (plain(name) ? v : structuredClone(v)); }
    return tx(name, 'readonly', s => s.get(key));
  },
  async getMany(name, keys) {
    if (!idb) return keys.map(k => mem[name].get(k));
    return new Promise((resolve, reject) => {
      const t = idb.transaction(name, 'readonly'); const s = t.objectStore(name);
      const reqs = keys.map(k => s.get(k));
      t.oncomplete = () => resolve(reqs.map(r => r.result)); t.onerror = () => reject(t.error);
    });
  },
  async all(name) {
    if (!idb) return [...mem[name].values()].map(v => structuredClone(v));
    return tx(name, 'readonly', s => s.getAll());
  },
  async del(name, key) {
    if (!idb) { mem[name].delete(key); return; }
    return tx(name, 'readwrite', s => s.delete(key));
  },
  async clear(name) {
    if (!idb) { mem[name].clear(); return; }
    return tx(name, 'readwrite', s => s.clear());
  },
  async photosOf(dayId) {
    if (!idb) return [...mem.photos.values()].filter(p => p.day === dayId).map(v => structuredClone(v));
    return tx('photos', 'readonly', s => s.index('by_day').getAll(dayId));
  },
};
async function delPhoto(id) {
  await Promise.all([store.del('photos', id), store.del('blobs', id), store.del('thumbs', id)]);
  forgetPhoto(id);
}
async function getDay(id) {
  return (await store.get('days', id)) || { id, site: settings.site, order: [], updatedAt: Date.now() };
}

const DEFAULT_SETTINGS = {
  site: '',
  labels: { loc: '위치', desc: '내용', act: '조치' },

}
async function saveSettings() { try { await store.put('settings', settings, 'main'); } catch (e) { toast('설정을 저장하지 못했습니다.'); } }
const siteOf = day => (day && day.site) || settings.site || '';

// Version 1 kept 점검 건 (inspections) with image bytes inside each photo record. Move them into days.
async function migrate() {
  const insps = await store.all('inspections');
  if (!insps.length) return;
  const old = new Map((await store.all('photos')).map(p => [p.id, p]));
  for (const insp of insps) {
    const list = (insp.order || []).map(id => old.get(id)).filter(Boolean);
    if (insp.sample) { for (const p of list) await store.del('photos', p.id); continue; }
    const day = await getDay(insp.date || today());
    if (!day.site) day.site = insp.title || '';
    for (const p of list) {
      if (p.data) {
        await store.put('blobs', { id: p.id, blob: new Blob([p.data], { type: p.type || 'image/jpeg' }) });
        await store.put('thumbs', { id: p.id, blob: new Blob([p.thumb || p.data], { type: 'image/jpeg' }) });
      }
      const { data, thumb, type, include, inspectionId, ...meta } = p;
      await store.put('photos', { ...meta, day: day.id });
      if (!day.order.includes(p.id)) day.order.push(p.id);
    }
    day.updatedAt = Date.now();
    await store.put('days', day);
  }
  await store.clear('inspections');
}

/* ---------- image handling ---------- */
const MAX_SIDE = 1600, THUMB = 320;
async function decode(blob) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) {}
  }
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(blob); });
}
function canvasToBlob(c, type = 'image/jpeg', q = 0.85) {
  return new Promise(res => c.toBlob(b => res(b), type, q));
}
function drawScaled(src, max) {
  const k = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
// Decoded photos for the editor and publishing; a handful is plenty and keeps memory low on phones.
const bmpCache = new Map(); const urlCache = new Map();
function cacheBitmap(id, img) {
  bmpCache.delete(id); bmpCache.set(id, img);
  while (bmpCache.size > 6) bmpCache.delete(bmpCache.keys().next().value);
}
async function photoBitmap(p) {
  if (bmpCache.has(p.id)) { const b = bmpCache.get(p.id); cacheBitmap(p.id, b); return b; }
  const rec = await store.get('blobs', p.id);
  const b = await decode(rec.blob instanceof Blob ? rec.blob : new Blob([rec.blob], { type: 'image/jpeg' }));
  cacheBitmap(p.id, b); return b;
}
function forgetPhoto(id) { bmpCache.delete(id); const u = urlCache.get(id); if (u) URL.revokeObjectURL(u); urlCache.delete(id); }
// Thumbnails are drawn as <img data-thumb="id">; fill them in one read after the screen is on.
const thumbAttr = id => urlCache.has(id) ? `src="${urlCache.get(id)}"` : `data-thumb="${id}"`;
async function fillThumbs(root) {
  const imgs = [...root.querySelectorAll('img[data-thumb]')];
  if (!imgs.length) return;
  const ids = [...new Set(imgs.map(i => i.dataset.thumb))];
  try {
    const recs = await store.getMany('thumbs', ids);
    recs.forEach((r, k) => { if (r && !urlCache.has(ids[k])) urlCache.set(ids[k], URL.createObjectURL(r.blob instanceof Blob ? r.blob : new Blob([r.blob], { type: 'image/jpeg' }))); });
  } catch (e) {}
  imgs.forEach(i => { const u = urlCache.get(i.dataset.thumb); if (u) { i.src = u; i.removeAttribute('data-thumb'); } });
}

function getGeo() {
  return new Promise(res => {
    if (!settings.geo || !navigator.geolocation) return res(null);
    try { navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { timeout: 5000, maximumAge: 60000 }); }
    catch (e) { res(null); }
  });
}
// Adds photos to dayId, or to the day each was taken when dayId is null. Decodes each file once.
async function addFiles(files, dayId) {
  const geo = await getGeo();
  const days = new Map(); const ids = [];
  const list = [...files].sort((a, b) => (a.lastModified || 0) - (b.lastModified || 0));
  for (const f of list) {
    try {
      const src = await decode(f);
      const big = drawScaled(src, MAX_SIDE);
      if (src.close) src.close();
      const th = drawScaled(big, THUMB);
      const [bb, tb] = await Promise.all([canvasToBlob(big, 'image/jpeg', 0.85), canvasToBlob(th, 'image/jpeg', 0.72)]);
      const takenAt = f.lastModified || Date.now();
      const did = dayId || dayOf(takenAt);
      if (!days.has(did)) days.set(did, await getDay(did));
      const id = uid();
      await store.put('blobs', { id, blob: bb });
      await store.put('thumbs', { id, blob: tb });
      await store.put('photos', { id, day: did, w: big.width, h: big.height, takenAt, lat: geo?.lat ?? null, lng: geo?.lng ?? null, fields: { loc: '', desc: '', act: '' }, marks: [], publishedAt: null });
      urlCache.set(id, URL.createObjectURL(tb));
      cacheBitmap(id, big);
      days.get(did).order.push(id); ids.push(id);
    } catch (e) { toast('사진 한 장을 읽지 못해 건너뛰었습니다.'); }
  }
  for (const d of days.values()) { d.updatedAt = Date.now(); await store.put('days', d); }
  return ids;
}

/* ---------- marks: geometry + drawing (normalized 0..1 coords) ---------- */
const WIDTHS = [0, 0.0032, 0.0055, 0.0085]; // fraction of the shorter image side
function lw(m, W, H) { return Math.max(1.5, (WIDTHS[m.w] || WIDTHS[2]) * Math.min(W, H)); }
function drawArrow(ctx, x1, y1, x2, y2, w) {
  const a = Math.atan2(y2 - y1, x2 - x1), hl = Math.max(10, w * 4.2);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * hl * 0.6, y2 - Math.sin(a) * hl * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hl * Math.cos(a - 0.45), y2 - hl * Math.sin(a - 0.45));
  ctx.lineTo(x2 - hl * Math.cos(a + 0.45), y2 - hl * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
}
function drawMarks(ctx, marks, ox, oy, W, H) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const m of marks) {
    const w = lw(m, W, H); ctx.strokeStyle = m.c; ctx.fillStyle = m.c; ctx.lineWidth = w;
    const X = x => ox + x * W, Y = y => oy + y * H;
    if (m.t === 'pen') {
      ctx.beginPath(); m.p.forEach((pt, i) => i ? ctx.lineTo(X(pt[0]), Y(pt[1])) : ctx.moveTo(X(pt[0]), Y(pt[1]))); ctx.stroke();
    } else if (m.t === 'arrow') {
      drawArrow(ctx, X(m.x1), Y(m.y1), X(m.x2), Y(m.y2), w);
    } else if (m.t === 'circle') {
      const cx = X((m.x1 + m.x2) / 2), cy = Y((m.y1 + m.y2) / 2), rx = Math.abs(m.x2 - m.x1) * W / 2, ry = Math.abs(m.y2 - m.y1) * H / 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI * 2); ctx.stroke();
    } else if (m.t === 'rect') {
      ctx.strokeRect(X(Math.min(m.x1, m.x2)), Y(Math.min(m.y1, m.y2)), Math.abs(m.x2 - m.x1) * W, Math.abs(m.y2 - m.y1) * H);
    } else if (m.t === 'text') {
      const fs = Math.max(12, Math.min(W, H) * (0.03 + 0.012 * (m.w || 2)));
      ctx.font = `700 ${fs}px ${FONT_CANVAS}`; ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, fs * 0.16); ctx.strokeStyle = isLight(m.c) ? 'rgba(0,0,0,.75)' : 'rgba(255,255,255,.9)';
      ctx.strokeText(m.s, X(m.x), Y(m.y)); ctx.fillText(m.s, X(m.x), Y(m.y));
    } else if (m.t === 'num') {
      const r = Math.max(9, Math.min(W, H) * (0.022 + 0.006 * (m.w || 2)));
      ctx.beginPath(); ctx.arc(X(m.x), Y(m.y), r, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = Math.max(1.5, r * 0.14); ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.fillStyle = isLight(m.c) ? '#111' : '#fff'; ctx.font = `700 ${r * 1.15}px ${FONT_CANVAS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(m.n), X(m.x), Y(m.y) + r * 0.05); ctx.textAlign = 'left';
    }
  }
  ctx.restore();
}
function isLight(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 170; }
function bbox(m, ctx, W, H) {
  if (m.t === 'pen') { const xs = m.p.map(p => p[0]), ys = m.p.map(p => p[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; }
  if (m.t === 'text') {
    const fs = Math.max(12, Math.min(W, H) * (0.03 + 0.012 * (m.w || 2)));
    ctx.font = `700 ${fs}px ${FONT_CANVAS}`; const tw = ctx.measureText(m.s).width;
    return [m.x, m.y, m.x + tw / W, m.y + fs * 1.2 / H];
  }
  if (m.t === 'num') { const r = Math.min(W, H) * (0.022 + 0.006 * (m.w || 2)); return [m.x - r / W, m.y - r / H, m.x + r / W, m.y + r / H]; }
  return [Math.min(m.x1, m.x2), Math.min(m.y1, m.y2), Math.max(m.x1, m.x2), Math.max(m.y1, m.y2)];
}
function moveMark(m, dx, dy) {
  if (m.t === 'pen') m.p = m.p.map(p => [p[0] + dx, p[1] + dy]);
  else if (m.t === 'text' || m.t === 'num') { m.x += dx; m.y += dy; }
  else { m.x1 += dx; m.x2 += dx; m.y1 += dy; m.y2 += dy; }
}
const FONT_CANVAS = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';

/* ---------- app state + router ---------- */
const state = { view: 'home', photoIdx: 0, reorder: false, from: 'home', pickDay: null };

function ordered(day, list) {
  const byId = new Map(list.map(p => [p.id, p]));
  const out = day.order.map(i => byId.get(i)).filter(Boolean);
  for (const p of list) if (!day.order.includes(p.id)) out.push(p);
  return out;
}
async function loadDay(id) {

}

/* ---------- sheet ---------- */
function openSheet(html, onMount) {

  o.innerHTML = `<div class="scrim" id="scrim"><div class="sheet gutter" role="dialog" aria-modal="true">${html}</div></div>`;

function confirmSheet(title, body, okLabel, onOk, danger = true) {

/* ---------- shared pieces ---------- */
function stats(ps) {
  const pub = ps.filter(p => p.publishedAt).length, miss = ps.filter(p => !p.fields.desc.trim()).length;
  return `<span class="chip">사진 ${ps.length}</span>${pub ? `<span class="chip ok">발행 ${pub}</span>` : ''}${miss ? `<span class="chip warn">설명 없음 ${miss}</span>` : ''}`;
}
function tiles(ps, { reorder = false } = {}) {
  return `<div class="grid">${ps.map((p, k) => `
    <div class="tile" ${reorder ? '' : `role="button" tabindex="0" data-edit="${k}"`} aria-label="${fmtTime(p.takenAt)} 사진${p.publishedAt ? ', 발행됨' : ''}">
      <img ${thumbAttr(p.id)} alt="">
      ${p.publishedAt ? '<span class="pub">발행</span>' : ''}
      ${!p.fields.desc.trim() ? '<span class="flag">설명 없음</span>' : ''}
      ${reorder ? `<div class="reorder"><button data-mv="${k}" data-d="-1" aria-label="앞으로" ${k === 0 ? 'disabled' : ''}>◀</button><button data-mv="${k}" data-d="1" aria-label="뒤로" ${k === ps.length - 1 ? 'disabled' : ''}>▶</button></div>` : `<span class="time">${fmtTime(p.takenAt)}</span>`}
    </div>`).join('')}</div>`;
}
function bindTiles(root, day, ps, from) {

/* ---------- home: today first, then past days ---------- */
async function renderHome() {
  setTop('현장 사진대지', { sub: settings.site || '현장명은 설정에서 입력', right: `<button class="iconbtn" id="setBtn" aria-label="설정">${svg('gear')}</button>` });

      </div>

    </section>
    ${past.length ? `<span class="eyebrow">지난 기록</span>` : ''}
    <div class="days">${past.map(({ d, ps }) => {

/* ---------- one day ---------- */

    </div>
    ${photos.length ? tiles(photos, { reorder: state.reorder }) : `<div class="empty"><b>사진이 없습니다</b><span>${isToday ? '촬영하거나 갤러리에서 가져오세요.' : '갤러리에서 이 날짜로 사진을 추가할 수 있습니다.'}</span></div>`}

  });
  setActions(isToday
    ? `<button class="btn primary grow" id="camBtn">${svg('cam')}촬영</button><button class="btn" id="galBtn">${svg('img')}가져오기</button>`
    : `<button class="btn primary grow" id="galBtn">${svg('img')}이 날짜로 사진 추가</button>`);

}

    $('#siteForm', s).onsubmit = async e => {

function wrapLines(ctx, text, maxW, maxLines) {

    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch.trim() ? ch : ''; } else line += ch;
  }

    cut[maxLines - 1] = last + '…'; return cut;

}

// One photo per image, sized for reading on a phone: the table type is about 4% of the width.
async function composeSingle(day, p) {
  const W = 1200, m = 24, band = 100, stripe = 14, head = band + stripe;
  const opt = { fs: 44, lab: 170, pad: 20, minRow: 82, maxLines: 4 };
  const mctx = document.createElement('canvas').getContext('2d');
  const rows = photoRows(p);
  const th = drawTable(mctx, rows, 0, 0, W - m * 2, { ...opt, measureOnly: true });
  const img = await photoBitmap(p);
  const pw = W - m * 2, ph = Math.min(pw * img.height / img.width, pw * 1.8);
  const H = Math.round(head + m + ph + 16 + th + m);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = OUT.yellow; ctx.fillRect(0, 0, W, band);
  hazard(ctx, 0, band, W, stripe);
  const date = fmtDate(day.id);
  ctx.textBaseline = 'middle'; ctx.fillStyle = OUT.ink;
  ctx.font = `600 34px ${FONT_CANVAS}`; const dateW = ctx.measureText(date).width;
  ctx.textAlign = 'right'; ctx.fillText(date, W - m, band / 2); ctx.textAlign = 'left';
  ctx.font = `700 46px ${FONT_CANVAS}`;
  ctx.fillText(wrapLines(ctx, siteOf(day) || '사진대지', W - m * 3 - dateW, 1)[0], m, band / 2);
  const y = head + m;
  ctx.fillStyle = '#F4F2EC'; ctx.fillRect(m, y, pw, ph);
  await drawPhoto(ctx, p, m, y, pw, ph);
  ctx.strokeStyle = OUT.line; ctx.lineWidth = 1.5; ctx.strokeRect(m, y, pw, ph);
  drawTable(ctx, rows, m, y + ph + 16, W - m * 2, opt);
  return c;
}

/* ---------- saving or sharing a finished sheet ---------- */
let dlNs;
const downloadsNs = () => dlNs ??= (window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null));
function blobToBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
const safeName = s => String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 30);
function publishName(p) {
  const d = new Date(p.takenAt);
  const loc = safeName(p.fields.loc);
  return `사진대지_${dayOf(p.takenAt).replaceAll('-', '')}_${pad2(d.getHours())}${pad2(d.getMinutes())}${loc ? '_' + loc : ''}.jpg`;
}
// Returns the message to show once done, or null when nothing happened (cancelled or failed).
async function deliver(blob, name, mode) {
  if (window.AndroidBridge) {
    const b64 = await blobToBase64(blob);
    const r = String(mode === 'share' ? window.AndroidBridge.shareFile(name, 'image/jpeg', b64) : window.AndroidBridge.saveFile(name, 'image/jpeg', b64));
    if (r.startsWith('error:')) { toast(mode === 'share' ? '보내기 창을 열지 못했습니다.' : '저장하지 못했습니다. 저장 공간을 확인해 주세요.', 4000); return null; }
    return mode === 'share' ? '발행했습니다. 보낼 곳을 고르세요.' : `발행했습니다. ${r}에 저장됨`;
  }
  if (mode === 'share') {
    const file = new File([blob], name, { type: 'image/jpeg' });
    if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
      try { await navigator.share({ files: [file] }); return '발행했습니다.'; } catch (e) { if (e.name === 'AbortError') return null; }
    }
  }
  const ns = await downloadsNs();
  if (ns) {
    try { await ns.save({ filename: name, data: blob }); return '발행했습니다. 파일을 저장했습니다.'; }
    catch (e) { if (e?.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없습니다.'); return null; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  return '발행했습니다. 파일을 내려받았습니다.';
}

  $('#sForm').onsubmit = async e => {

    await saveSettings(); toast('저장했습니다.'); go('home');
  };
  setActions('');
}

/* ---------- sample day (clearly labelled 예시, on yesterday) ---------- */
function synthPhoto(kind) {
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1200; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1200); g.addColorStop(0, '#9BA3A8'); g.addColorStop(1, '#6F777C'); x.fillStyle = g; x.fillRect(0, 0, 1600, 1200);
  let s = kind * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${rnd() > .5 ? '255,255,255' : '0,0,0'},${rnd() * .08})`; x.fillRect(rnd() * 1600, rnd() * 1200, 3, 3); }
  if (kind === 0) { // column with exposed rebar
    x.fillStyle = '#B5B9B6'; x.fillRect(560, 0, 480, 1200); x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(1000, 0, 40, 1200);
    x.fillStyle = '#5A3A2A'; for (let i = 0; i < 4; i++) x.fillRect(700 + i * 70, 420, 14, 260);
    x.fillStyle = '#7A7F7C'; x.beginPath(); x.ellipse(800, 550, 170, 190, 0, 0, Math.PI * 2); x.globalAlpha = .35; x.fill(); x.globalAlpha = 1;
  } else if (kind === 1) { // stairwell edge without guardrail
    x.fillStyle = '#C9CCC8'; for (let i = 0; i < 7; i++) x.fillRect(200 + i * 150, 1100 - i * 130, 600, 130);
    x.fillStyle = '#2B2F33'; x.fillRect(1250, 0, 350, 1200);
  } else { // wall crack
    x.fillStyle = '#C2C5C1'; x.fillRect(0, 0, 1600, 1200);
    x.strokeStyle = '#3C3F3D'; x.lineWidth = 6; x.beginPath(); x.moveTo(420, 120); [[520, 340], [480, 520], [610, 700], [570, 880], [690, 1100]].forEach(([a, b]) => x.lineTo(a, b)); x.stroke();
  }
  return c;
}
async function seedSample() {
  const y = new Date(); y.setDate(y.getDate() - 1); y.setHours(10, 0, 0, 0);
  const day = { id: dayOf(y), site: '(예시) OO아파트 신축공사', order: [], sample: true, updatedAt: Date.now() };
  const data = [
    { f: { loc: '3층 B구역 기둥 C-3', desc: '피복 두께 부족, 철근 노출', act: '보수 후 재점검 요청' }, m: [{ t: 'circle', x1: .37, y1: .26, x2: .63, y2: .66, c: '#E53935', w: 3 }, { t: 'text', x: .66, y: .3, s: '철근 노출', c: '#E53935', w: 2 }] },
    { f: { loc: '4층 계단실', desc: '안전난간 미설치', act: '즉시 설치 지시' }, m: [{ t: 'arrow', x1: .55, y1: .2, x2: .74, y2: .42, c: '#FDD835', w: 3 }, { t: 'num', x: .5, y: .16, n: 1, c: '#FDD835', w: 2 }] },
    { f: { loc: '3층 A구역 벽체', desc: '', act: '' }, m: [{ t: 'rect', x1: .22, y1: .06, x2: .48, y2: .95, c: '#E53935', w: 2 }] },
  ];
  for (let k = 0; k < data.length; k++) {
    const c = synthPhoto(k); const th = drawScaled(c, THUMB);
    const [bb, tb] = await Promise.all([canvasToBlob(c, 'image/jpeg', 0.85), canvasToBlob(th, 'image/jpeg', 0.72)]);
    const id = uid() + k;
    await store.put('blobs', { id, blob: bb }); await store.put('thumbs', { id, blob: tb });
    await store.put('photos', { id, day: day.id, w: 1600, h: 1200, takenAt: y.getTime() + k * 1200000, lat: null, lng: null, fields: data[k].f, marks: data[k].m, publishedAt: null });
    day.order.push(id);

  await store.put('days', day);
}
